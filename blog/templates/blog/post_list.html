<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Список постів</title>
</head>
<body>
    <h1>Список постів</h1>
    <ul>
        {% for post in posts %}
            <li>
                <a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a>
                — {{ post.published_date }} ({{ post.author.name }})
            </li>
        {% empty %}
            <li>Постів поки немає.</li>
        {% endfor %}
    </ul>
</body>
</html>
