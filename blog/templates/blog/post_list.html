<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Список постів</title>
</head>
<body>
    <h1>Список постів</h1>
    <ul>
        {% for post in posts %}
            <li>
                <h2>{{ post.title }}</h2>
                <p>{{ post.published_date }}</p>
            </li>
        {% empty %}
            <li>Постів поки немає.</li>
        {% endfor %}
    </ul>
</body>
</html>
